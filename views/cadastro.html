<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - MyWords</title>
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
    <div class="auth-app">
        <header class="auth-topbar">
            <div class="brand">✍️ <span>MyWords</span></div>
            <div class="auth-top-actions">
                <a class="auth-link" href="login.html">Login</a>
                <a class="auth-link" href="index.html">Início</a>
            </div>
        </header>

        <main class="auth-main">
            <section class="auth-card">
                <h1>Cadastro</h1>
                <p class="descricao">Crie sua conta para começar a salvar seus textos.</p>

                <form id="formCadastro">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input id="nome" type="text" autocomplete="name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input id="email" type="email" autocomplete="email" required>
                    </div>

                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input id="senha" type="password" autocomplete="new-password" required>
                    </div>

                    <div class="form-group">
                        <label for="confirmarSenha">Confirmar senha</label>
                        <input id="confirmarSenha" type="password" autocomplete="new-password" required>
                    </div>

                    <button class="btn-auth" type="submit">Cadastrar</button>
                    <div id="mensagem" class="auth-mensagem" aria-live="polite"></div>
                </form>

                <p class="auth-alternativa">Já tenho login. <a href="login.html">Entrar</a></p>
            </section>
        </main>
    </div>

    <script src="../js/auth.js"></script>
</body>
</html>
