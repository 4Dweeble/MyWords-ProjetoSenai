<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Textos</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">✍️ <span>MyWords</span></div>
            <button id="novoTexto" class="btn-novo">＋ Novo texto</button>

            <div class="pesquisa">
                <span>🔍</span>
                <input id="pesquisa" type="search" placeholder="Pesquisar textos...">
            </div>

            <nav>
                <div class="nav-titulo">MEUS TEXTOS</div>
                <div id="listaTextos" class="lista-textos"></div>
            </nav>

            <div class="sidebar-footer">
                <span id="contadorTextos">0 textos</span>
            </div>
        </aside>

        <main class="conteudo">
            <header class="topbar">
                <div>
                    <div class="status" id="status">Pronto</div>
                </div>
                <div class="top-actions">
                    <button id="salvar" class="btn-secundario">💾 Salvar</button>
                    <button id="baixar" class="btn-word">📥 Baixar Word</button>
                    <a href="login.html" class="btn-secundario" style="text-decoration:none; color:inherit;">Login</a>
                </div>
            </header>

            <section class="editor-area">
                <input id="titulo" class="titulo" type="text" placeholder="Título do texto">
                <div class="info">
                    <span id="ultimaAlteracao">Novo texto</span>
                    <span id="contadorPalavras">0 palavras</span>
                </div>

                <div class="toolbar">
                    <button data-cmd="bold"><strong>N</strong></button>
                    <button data-cmd="italic"><em>I</em></button>
                    <button data-cmd="underline"><u>S</u></button>
                    <span class="separador"></span>
                    <select id="tamanhoFonte">
                        <option value="">Tamanho</option>
                        <option value="2">Pequeno</option>
                        <option value="3">Normal</option>
                        <option value="5">Grande</option>
                        <option value="7">Muito grande</option>
                    </select>
                    <button data-cmd="justifyLeft">⇤</button>
                    <button data-cmd="justifyCenter">≡</button>
                    <button data-cmd="justifyRight">⇥</button>
                    <button data-cmd="insertUnorderedList">• Lista</button>
                </div>

                <div id="editor" class="editor" contenteditable="true" spellcheck="true"></div>

                <div class="rodape-editor">
                    <button id="excluir" class="btn-excluir">🗑️ Excluir texto</button>
                    <span>Salvamento automático ativado</span>
                </div>
            </section>
        </main>
    </div>

    <div id="modalConfirmacao" class="modal hidden">
        <div class="modal-card">
            <h2>Excluir texto?</h2>
            <p>O texto será removido da sua lista. Esta ação pode ser confirmada novamente.</p>
            <div class="modal-actions">
                <button id="cancelarExclusao" class="btn-secundario">Cancelar</button>
                <button id="confirmarExclusao" class="btn-excluir-confirmar">Excluir</button>
            </div>
        </div>
    </div>

    <script src="../js/script.js"></script>
</body>
</html>
